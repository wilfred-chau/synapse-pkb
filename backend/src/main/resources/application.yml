spring:
  application:
    name: synapse-pkb-backend
  config:
    import: optional:file:./.env.local[.properties],optional:file:../.env.local[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${APP_JWT_SECRET}
    jwt-expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:720}
    bootstrap-user:
      enabled: ${APP_BOOTSTRAP_ENABLED:true}
      username: ${APP_BOOTSTRAP_USERNAME}
      password: ${APP_BOOTSTRAP_PASSWORD}
      display-name: ${APP_BOOTSTRAP_DISPLAY_NAME}
      space-key: ${APP_BOOTSTRAP_SPACE_KEY:personal-space}

info:
  app:
    name: Synapse PKB Backend
    stage: module-a2-non-ai

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    com.wilfredchau.synapsepkb: ${APP_LOG_LEVEL:INFO}
    com.wilfredchau.synapsepkb.user.mapper: INFO
    com.wilfredchau.synapsepkb.operationlog.mapper: INFO
