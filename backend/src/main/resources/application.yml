spring:
  application:
    name: synapse-pkb-backend

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173

info:
  app:
    name: Synapse PKB Backend
    stage: skeleton
