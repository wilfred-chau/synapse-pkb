spring:
  application:
    name: synapse-pkb-backend
  config:
    import: optional:file:./.env.local[.properties],optional:file:../.env.local[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${APP_JWT_SECRET}
    jwt-expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:720}
    bootstrap-user:
      username: ${APP_BOOTSTRAP_USERNAME}
      password: ${APP_BOOTSTRAP_PASSWORD}
      display-name: ${APP_BOOTSTRAP_DISPLAY_NAME}
      space-key: ${APP_BOOTSTRAP_SPACE_KEY:personal-space}

info:
  app:
    name: Synapse PKB Backend
    stage: module-a1
