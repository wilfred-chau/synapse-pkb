spring:
  datasource:
    url: jdbc:h2:mem:synapsepkb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: http://localhost:5173
  security:
    jwt-secret: 12345678901234567890123456789012
    jwt-expiration-minutes: 720
    bootstrap-user:
      username: pkb-admin
      password: Password123!
      display-name: Wilfred
      space-key: personal-space

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    com.wilfredchau.synapsepkb: DEBUG
